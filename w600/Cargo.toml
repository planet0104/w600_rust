[package]
name = "w600"
description = "联盟微 W600 / W800 Wi-Fi 芯片的 Rust 开发库：运行时、RTOS、外设、Wi-Fi 与网络"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["embedded", "no-std", "hardware-support"]
keywords = ["w600", "w800", "winnermicro", "wifi", "embedded-hal"]

[features]
default = ["panic-handler"]
# 提供打印到调试串口后停机的 #[panic_handler]；关闭后可以使用自己的实现。
panic-handler = []

# 芯片由编译目标决定：thumbv7m-none-eabi（Cortex-M3）为 W600，C-SKY 为 W800。
[target.'cfg(target_arch = "arm")'.dependencies]
w600-sys = { path = "../w600-sys", version = "0.1.0" }

[target.'cfg(target_arch = "csky")'.dependencies]
w800-sys = { path = "../w800-sys", version = "0.1.0" }
# W800 的 Flash 足够大，额外支持 RSA 签名的证书（W600 的 512KB 应用区放不下）。
# 再加 p384 会多出约 150KB，W800 的应用区也只剩约 40KB，因此没有开启。
embedded-tls = { path = "../third_party/embedded-tls", default-features = false, features = ["rustpki", "rsa"] }

[dependencies]
embedded-hal = "1.0"
embedded-io = "0.7"
# TLS 1.3 客户端；rustpki 校验证书链（ECDSA P-256）。
# 使用打过补丁的 0.19.0（见 third_party/embedded-tls/Cargo.toml），否则无法连接在 EncryptedExtensions 中
# 列出未知密钥交换组的服务器（国内很多网站如此）。
embedded-tls = { path = "../third_party/embedded-tls", default-features = false, features = ["rustpki"] }
rand_chacha = { version = "0.3", default-features = false }
rand_core = "0.6"
sha2 = { version = "0.10", default-features = false }
