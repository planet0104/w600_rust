[package]
edition = "2024"
name = "embedded-tls"
version = "0.19.0"
build = false
exclude = [".github"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "TLS 1.3 client with no_std support and no allocator"
homepage = "https://drogue.io"
documentation = "https://docs.rs/embedded-tls"
readme = "README.md"
keywords = [
    "embedded",
    "async",
    "tls",
    "no_std",
    "network",
]
license = "Apache-2.0"
repository = "https://github.com/drogue-iot/embedded-tls"

[package.metadata.docs.rs]
features = [
    "webpki",
    "rustpki",
    "rsa",
    "ed25519",
    "p384",
]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
alloc = []
default = [
    "std",
    "log",
    "tokio",
]
defmt = [
    "dep:defmt",
    "embedded-io/defmt",
    "heapless/defmt",
]
ed25519 = [
    "dep:ed25519-dalek",
    "rustpki",
]
p384 = [
    "dep:p384",
    "rustpki",
]
rsa = [
    "dep:rsa",
    "rustpki",
    "alloc",
]
rustpki = [
    "dep:der",
    "dep:const-oid",
]
std = [
    "embedded-io/std",
    "embedded-io-async/std",
]
tokio = ["embedded-io-adapters/tokio-1"]
webpki = ["dep:webpki"]

[lib]
name = "embedded_tls"
path = "src/lib.rs"

[dependencies.aes-gcm]
version = "0.10.1"
features = ["aes"]
default-features = false

[dependencies.const-oid]
version = "0.10.1"
optional = true

[dependencies.defmt]
version = "1.0.1"
optional = true

[dependencies.der]
version = "0.8.0-rc.2"
features = [
    "derive",
    "oid",
    "time",
    "heapless",
]
