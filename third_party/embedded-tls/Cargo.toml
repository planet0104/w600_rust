[dependencies.digest]
version = "0.10.3"
features = ["core-api"]
default-features = false

[dependencies.ecdsa]
version = "0.16.9"
default-features = false

[dependencies.ed25519-dalek]
version = "2.2"
optional = true
default-features = false

[dependencies.embedded-io]
version = "0.7"

[dependencies.embedded-io-adapters]
version = "0.7"
optional = true

[dependencies.embedded-io-async]
version = "0.7"

[dependencies.generic-array]
version = "0.14"
default-features = false

[dependencies.heapless]
version = "0.9"
default-features = false

[dependencies.hkdf]
version = "0.12.3"

[dependencies.hmac]
version = "0.12.1"

[dependencies.log]
version = "0.4"
optional = true

[dependencies.p256]
version = "0.13"
features = [
    "ecdh",
    "ecdsa",
    "sha256",
]
default-features = false

[dependencies.p384]
version = "0.13"
features = [
    "ecdsa",
    "sha384",
]
optional = true
default-features = false

[dependencies.portable-atomic]
version = "1.6.0"
default-features = false

[dependencies.rand_core]
version = "0.6.3"
